[package]
name = "hiss"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# steel-core, abi_stable and async-ffi are pinned to what the Steel fork of
# Helix uses (fork 424add10, see Cargo.lock there), so the dylib ABI matches.
[dependencies]
abi_stable = "=0.11.3"
async-ffi = { version = "=0.5.0", features = ["abi_stable"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "stream"] }
serde_json = "1"
steel-core = { git = "https://github.com/mattwparas/steel.git", rev = "24cd21598c091fb88bc10a6375a1ded25e677c37", features = ["anyhow", "dylibs", "sync", "biased", "imbl"] }
tokio = { version = "1.52", default-features = false, features = ["rt-multi-thread", "sync", "time"] }

# No panic = "abort": the library runs inside the editor. No strip either,
# not even the debuginfo strip cargo does by default: on this macOS (Darwin 27)
# a stripped libhiss fails dlopen with "mis-aligned LINKEDIT string pool", and
# Steel's loader then panics inside the editor.
[profile.release]
lto = true
codegen-units = 1
strip = "none"

[profile.quick]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
